<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d14" />
<title>XiaozLucifer-v10 · 智能推理引擎</title>

<!--
  ================================================================
   部署说明（GitHub Pages）
   1) 新建仓库，把本文件保存为 index.html 放到仓库根目录
   2) 在仓库里新建文件夹 assets/ ，放入你的背景图与头像：
        assets/bg.jpg            ← 登录页 & 聊天页背景
        assets/ai-avatar.png     ← AI 头像
   3) 在仓库里新建文件夹 music/ ，放入歌曲 mp3（名字必须与歌单一致）：
        music/琵琶行.mp3  music/琵琶曲.mp3  ...  music/That Girl.mp3
   4) 仓库 Settings → Pages → Source: Deploy from a branch → main / (root) → Save
   5) 访问 https://<你的用户名>.github.io/<仓库名>/
  ================================================================
   需要修改的地方全部集中在下面的【配置区】里
  ================================================================
-->

<style>
/* ============================================================
   全局变量
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --accent: #7c5cff;
  --accent2: #22d3ee;
  --text: #e9ecf5;
  --muted: #98a0b8;
  --line: rgba(255, 255, 255, .10);
  --panel: rgba(16, 18, 28, .62);
  --bg-image: none;          /* 由 JS 注入 */
}

html, body { height: 100%; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: #0b0d14;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button, input, textarea { font-family: inherit; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.28); }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   背景层（使用页面背景图片）
   ============================================================ */
#bgLayer {
  position: fixed; inset: 0; z-index: -2;
  background-color: #12141f;
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#bgMask {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(1100px 700px at 12% 6%, rgba(124, 92, 255, .30), transparent 60%),
    radial-gradient(1000px 700px at 88% 94%, rgba(34, 211, 238, .20), transparent 60%),
    linear-gradient(180deg, rgba(6, 8, 15, .58), rgba(6, 8, 15, .88));
}

/* ============================================================
   屏幕容器
   ============================================================ */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen.hidden { display: none; }

/* ============================================================
   登录页
   ============================================================ */
#loginScreen {
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
}

.login-card {
  width: min(92vw, 400px);
  padding: 30px 28px 26px;
  border-radius: 22px;
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, .14);
  backdrop-filter: blur(22px) saturate(1.25);
  -webkit-backdrop-filter: blur(22px) saturate(1.25);
  box-shadow: 0 26px 70px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
  animation: cardIn .5s cubic-bezier(.2, .8, .3, 1) both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(18px) scale(.97); }
  to   { opacity: 1; transform: none; }
}

.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }

.brand-logo {
  position: relative;
  width: 46px; height: 46px; flex: 0 0 auto;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: grid; place-items: center;
  font-weight: 800; font-size: 17px; color: #fff;
  overflow: hidden;
  box-shadow: 0 8px 22px rgba(124, 92, 255, .45);
}
.brand-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.brand h1 {
  margin: 0;
  font-size: 18px;
  letter-spacing: .3px;
  font-weight: 700;
  background: linear-gradient(90deg, #fff, #bfc8ff 60%, #9ff0ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand .sub { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

.field { display: block; margin-bottom: 15px; }
.field > span {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 7px;
  letter-spacing: .3px;
}

.field input {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid rgba(255, 255, 255, .12);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.field input::placeholder { color: rgba(152, 160, 184, .7); }
.field input:focus {
  border-color: rgba(124, 92, 255, .75);
  box-shadow: 0 0 0 3px rgba(124, 92, 255, .18);
  background: rgba(255, 255, 255, .08);
}

.pwd-wrap { position: relative; }
.pwd-wrap input { padding-right: 46px; }
.pwd-eye {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px;
  border: 0; border-radius: 9px;
  background: transparent; color: var(--muted);
  font-size: 15px; cursor: pointer;
}
.pwd-eye:hover { background: rgba(255,255,255,.08); color: #fff; }

.remember {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted);
  margin: 4px 0 18px;
  cursor: pointer;
  user-select: none;
}
.remember input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

.btn-primary {
  width: 100%; height: 47px;
  border: 0; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #5b8bff 55%, var(--accent2));
  color: #fff;
  font-weight: 700; font-size: 15px; letter-spacing: 2px;
  cursor: pointer;
  transition: transform .15s, box-shadow .2s, filter .2s;
  box-shadow: 0 12px 30px rgba(124, 92, 255, .38);
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:active { transform: translateY(1px) scale(.995); }

.login-msg {
  min-height: 18px;
  margin-top: 12px;
  font-size: 12.5px;
  text-align: center;
  color: #ff8a8a;
}
.login-msg.ok { color: #6ee7b7; }

.shake { animation: shake .38s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(3px); }
}

/* ============================================================
   聊天页 - 顶栏
   ============================================================ */
#chatScreen { height: 100dvh; height: 100vh; }
@supports (height: 100dvh) { #chatScreen { height: 100dvh; } }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(10, 12, 20, .62);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-info { min-width: 0; }
.tb-title { font-size: 14.5px; font-weight: 700; letter-spacing: .3px; }
.tb-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

.avatar {
  position: relative;
  width: 38px; height: 38px; flex: 0 0 auto;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: grid; place-items: center;
  font-weight: 700; font-size: 14px; color: #fff;
  overflow: hidden;
  user-select: none;
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.avatar.sm { width: 36px; height: 36px; border-radius: 11px; font-size: 13.5px; }

.tb-right { display: flex; gap: 8px; flex: 0 0 auto; }
.icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, .05);
  color: var(--muted);
  font-size: 15px;
  cursor: pointer;
  transition: .18s;
}
.icon-btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }
.icon-btn:active { transform: scale(.95); }

/* ============================================================
   聊天页 - 消息区
   ============================================================ */
.messages {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  overscroll-behavior: contain;
}
.messages > * { width: 100%; max-width: 900px; margin: 0 auto; }

.msg { display: flex; gap: 10px; align-items: flex-start; animation: msgIn .28s ease both; }
.msg.user { flex-direction: row-reverse; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.msg.user .avatar { background: linear-gradient(135deg, #f59e0b, #ef4444); }

.bubble-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 100%; }
.msg.user .bubble-wrap { align-items: flex-end; }

.meta { font-size: 11.5px; color: var(--muted); padding-left: 3px; letter-spacing: .2px; }

.bubble {
  max-width: 100%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.75;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.msg.assistant .bubble {
  background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(255, 255, 255, .10);
  border-top-left-radius: 6px;
  backdrop-filter: blur(6px);
}
.msg.user .bubble {
  background: linear-gradient(135deg, rgba(124, 92, 255, .95), rgba(88, 68, 208, .95));
  border-top-right-radius: 6px;
  box-shadow: 0 8px 22px rgba(124, 92, 255, .25);
}
.msg.error .bubble { border-color: rgba(255, 120, 120, .45); background: rgba(255, 80, 80, .10); }

.msg-img {
  display: block;
  max-width: min(300px, 62vw);
  max-height: 300px;
  border-radius: 10px;
  margin-bottom: 10px;
  cursor: zoom-in;
  border: 1px solid rgba(255, 255, 255, .15);
}

/* Markdown 内容样式 */
.body > :first-child { margin-top: 0; }
.body > :last-child { margin-bottom: 0; }
.body p { margin: 0 0 10px; }
.body h1, .body h2, .body h3, .body h4, .body h5, .body h6 {
  margin: 16px 0 10px; line-height: 1.4; font-weight: 700;
}
.body h1 { font-size: 20px; }
.body h2 { font-size: 18px; }
.body h3 { font-size: 16.5px; }
.body h4, .body h5, .body h6 { font-size: 15px; }
.body ul, .body ol { margin: 8px 0 10px; padding-left: 22px; }
.body li { margin: 4px 0; }
.body blockquote {
  margin: 10px 0; padding: 2px 0 2px 12px;
  border-left: 3px solid rgba(255, 255, 255, .28);
  color: var(--muted);
}
.body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.body a { color: #7cc7ff; text-decoration: none; }
.body a:hover { text-decoration: underline; }
.body pre {
  margin: 10px 0;
  padding: 12px 14px;
  background: rgba(0, 0, 0, .48);
  border: 1px solid rgba(255, 255, 255, .09);
  border-radius: 10px;
  overflow-x: auto;
}
.body pre code {
  background: none; padding: 0; font-size: 13.5px; line-height: 1.6;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.body code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13.5px;
  background: rgba(255, 255, 255, .13);
  padding: 1px 6px;
  border-radius: 6px;
}
.body table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid rgba(255,255,255,.16); padding: 6px 10px; }

/* 光标闪烁（流式中） */
.caret {
  display: inline-block;
  width: 7px; height: 15px;
  background: var(--accent2);
  border-radius: 2px;
  vertical-align: -2px;
  margin-left: 3px;
  animation: blink 1s steps(2, start) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* 消息操作按钮 */
.actions {
  display: flex; gap: 6px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s;
  padding: 0 3px;
}
.msg:hover .actions, .msg:focus-within .actions { opacity: 1; pointer-events: auto; }
@media (hover: none) { .actions { opacity: 1; pointer-events: auto; } }

.act {
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .06);
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  transition: .16s;
}
.act:hover { background: rgba(255, 255, 255, .14); color: #fff; }

/* 编辑态 */
.editor { width: 100%; }
.edit-area {
  width: 100%;
  min-height: 96px;
  max-height: 52vh;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(0, 0, 0, .38);
  border: 1px solid rgba(124, 92, 255, .55);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.7;
  outline: none;
  resize: vertical;
  box-shadow: 0 0 0 3px rgba(124, 92, 255, .15);
}
.edit-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.mini {
  padding: 5px 14px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .07);
  color: var(--text);
  font-size: 12.5px;
  cursor: pointer;
  transition: .16s;
}
.mini:hover { background: rgba(255, 255, 255, .15); }
.mini.primary {
  background: linear-gradient(135deg, var(--accent), #5b8bff);
  border-color: transparent;
  font-weight: 600;
}
.edit-hint { font-size: 11.5px; color: var(--muted); margin-left: auto; }

/* ============================================================
   音乐播放器
   ============================================================ */
.player-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: rgba(12, 14, 22, .72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255, 255, 255, .07);
}
.pbtn {
  width: 34px; height: 34px; flex: 0 0 auto;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .06);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  display: grid; place-items: center;
  transition: .16s;
}
.pbtn:hover { background: rgba(255, 255, 255, .15); }
.pbtn:active { transform: scale(.93); }

.p-info { flex: 1 1 auto; min-width: 0; }
.p-name {
  font-size: 12.5px;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 5px;
}
.p-name.err { color: #ff9a9a; }
.p-track {
  height: 4px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .13);
  cursor: pointer;
  overflow: hidden;
}
.p-bar {
  height: 100%;
  width: 0%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .1s linear;
}
.p-time {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 74px;
  text-align: right;
}

.playlist {
  position: fixed;
  right: 14px;
  bottom: 132px;
  width: 244px;
  max-height: 46vh;
  overflow-y: auto;
  padding: 8px;
  border-radius: 14px;
  background: rgba(16, 18, 28, .95);
  border: 1px solid rgba(255, 255, 255, .13);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: none;
  z-index: 60;
}
.playlist.show { display: block; animation: popIn .18s ease both; }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

.pl-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  transition: .15s;
}
.pl-item:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.pl-item.active { background: rgba(124, 92, 255, .22); color: #fff; }
.pl-idx { width: 16px; font-size: 11px; opacity: .7; flex: 0 0 auto; }
.pl-name { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-play { font-size: 11px; opacity: 0; }
.pl-item.active .pl-play { opacity: 1; color: var(--accent2); }

/* ============================================================
   输入区
   ============================================================ */
.composer {
  flex: 0 0 auto;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  background: rgba(10, 12, 20, .78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255, 255, 255, .07);
}
.composer-inner { max-width: 900px; margin: 0 auto; }

.c-box {
  border-radius: 16px;
  background: rgba(255, 255, 255, .055);
  border: 1px solid rgba(255, 255, 255, .12);
  padding: 8px 8px 8px 12px;
  transition: border-color .2s, box-shadow .2s;
}
.c-box:focus-within {
  border-color: rgba(124, 92, 255, .6);
  box-shadow: 0 0 0 3px rgba(124, 92, 255, .14);
}

.preview { display: none; }
.preview.show { display: flex; padding: 4px 0 8px; }
.thumb { position: relative; display: inline-block; }
.thumb img {
  display: block;
  width: 62px; height: 62px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, .18);
}
.thumb .del {
  position: absolute; top: -6px; right: -6px;
  width: 20px; height: 20px;
  border: 0; border-radius: 50%;
  background: #ff5c5c;
  color: #fff;
  font-size: 13px; line-height: 1;
  cursor: pointer;
  display: grid; place-items: center;
}

#input {
  display: block;
  width: 100%;
  min-height: 26px;
  max-height: 160px;
  padding: 6px 4px;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  resize: none;
  outline: none;
  overflow-y: auto;
}
#input::placeholder { color: rgba(152, 160, 184, .68); }

.c-tools { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
.tool-btn {
  width: 34px; height: 34px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .05);
  color: var(--muted);
  display: grid; place-items: center;
  font-size: 15px;
  cursor: pointer;
  transition: .16s;
}
.tool-btn:hover { background: rgba(255, 255, 255, .13); color: #fff; }

.model-tag {
  font-size: 11px;
  color: var(--muted);
  padding: 4px 9px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .04);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 46vw;
}
.model-tag.vision { color: #9ff0ff; border-color: rgba(34, 211, 238, .45); }

.send-btn {
  margin-left: auto;
  width: 38px; height: 38px;
  border: 0; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: grid; place-items: center;
  transition: .16s;
  box-shadow: 0 8px 20px rgba(124, 92, 255, .35);
}
.send-btn:hover:not(:disabled) { filter: brightness(1.1); }
.send-btn:active:not(:disabled) { transform: scale(.94); }
.send-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

/* 图片放大查看 */
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0, 0, 0, .9);
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
  cursor: zoom-out;
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 10px; }

/* 移动端微调 */
@media (max-width: 640px) {
  .brand h1 { font-size: 16.5px; }
  .bubble { font-size: 14.5px; padding: 11px 13px; }
  .messages { padding: 14px 10px 8px; gap: 15px; }
  .p-time { display: none; }
  .playlist { right: 8px; left: 8px; width: auto; }
}
</style>
</head>

<body>

<!-- 背景 -->
<div id="bgLayer"></div>
<div id="bgMask"></div>

<!-- ============================================================
     登录界面
     ============================================================ -->
<div id="loginScreen" class="screen">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand">

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

/* ================================================================
 * 轻量 Markdown 渲染（无第三方依赖，可离线运行）
 * ================================================================ */
function renderMarkdown(src) {
  if (src === null || src === undefined) return '';
  const codeStore = [];
  let text = String(src).replace(/\r\n?/g, '\n');

  // 流式输出时代码块可能还没闭合，临时补一个
  if ((text.match(/```/g) || []).length % 2 === 1) text += '\n```';

  // 1. 抽出围栏代码块
  text = text.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const idx = codeStore.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>') - 1;
    return '\u0000CODE' + idx + '\u0000';
  });

  // 2. 全局转义
  text = escapeHtml(text);

  // 3. 行内语法
  const inline = (s) => {
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    s = s.replace(/$$([^$$]+)\]$(https?:\/\/[^\s)]+)$/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  };

  // 4. 逐行块级解析
  const lines = text.split('\n');
  const out = [];
  let listType = null;
  let para = [];

  const flushPara = () => {
    if (para.length) {
      out.push('<p>' + para.map(inline).join('<br>') + '</p>');
      para = [];
    }
  };
  const closeList = () => {
    if (listType) { out.push('</' + listType + '>'); listType = null; }
  };

  for (const line of lines) {
    const t = line.trim();

    if (!t) { flushPara(); closeList(); continue; }

    // 代码块占位
    if (/^\u0000CODE\d+\u0000$/.test(t)) {
      flushPara(); closeList(); out.push(t); continue;
    }

    // 标题
    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara(); closeList();
      const lv = h[1].length;
      out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>');
      continue;
    }

    // 分割线
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushPara(); closeList(); out.push('<hr>'); continue; }

    // 引用
    if (/^&gt;\s?/.test(t)) {
      flushPara(); closeList();
      out.push('<blockquote>' + inline(t.replace(/^&gt;\s?/, '')) + '</blockquote>');
      continue;
    }

    // 无序列表
    const ul = t.match(/^[-*+]\s+(.*)$/);
    if (ul) {
      flushPara();
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>');
      continue;
    }

    // 有序列表
    const ol = t.match(/^\d+[.)]\s+(.*)$/);
    if (ol) {
      flushPara();
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + inline(ol[1]) + '</li>');
      continue;
    }

    // 普通段落
    closeList();
    para.push(t);
  }

  flushPara();
  closeList();

  let html = out.join('\n');
  html = html.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => codeStore[+i] || '');
  return html;
}

function startEdit(msgEl, msg) {

    '<span class="edit-hint">Ctrl/⌘ + Enter 保存</span>';

  editor.appendChild(ta);
  editor.appendChild(bar);

  bodyEl.parentNode.replaceChild(editor, bodyEl);

  const autoGrow = () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.52) + 'px';
  };
  autoGrow();
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  const backToBody = (text) => {
    const b = document.createElement('div');
    b.className = 'body';
    b.innerHTML = renderMarkdown(text);
    if (editor.parentNode) editor.parentNode.replaceChild(b, editor);
    msgEl._body = b;
  };

  const save = () => {
    msg.text = ta.value;
    backToBody(msg.text);
    saveHistory();
  };
  const cancel = () => backToBody(msg.text);

  bar.querySelector('[data-e="save"]').onclick = save;
  bar.querySelector('[data-e="cancel"]').onclick = cancel;

  ta.addEventListener('input', autoGrow);
  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); }
  });
}

function copyText(text) {
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

/* ================================================================
 * 调用 DeepSeek（流式）
 * ================================================================ */
async function callDeepSeek(apiMessages, model, onDelta) {
  const useProxy = !!(CONFIG.PROXY_URL && CONFIG.PROXY_URL.trim());
  const url = useProxy
    ? CONFIG.PROXY_URL.trim()
    : CONFIG.API_BASE.replace(/\/+$/, '') + '/chat/completions';

  const headers = { 'Content-Type': 'application/json' };
  if (!useProxy) {
    if (!CONFIG.API_KEY) throw new Error('未配置 API KEY');
    headers['Authorization'] = 'Bearer ' + CONFIG.API_KEY;
  }

  const res = await fetch(url, {
    method: 'POST',
    headers,
    body: JSON.stringify({
      model,
      messages: apiMessages,
      stream: true,
      temperature: 0.7
    })
  });

  if (!res.ok) {
    let detail = '';
    try { detail = await res.text(); } catch (e) {}
    throw new Error('HTTP ' + res.status + ' ' + (res.statusText || '') +
      (detail ? '\n' + detail.slice(0, 600) : ''));
  }

  const ctype = (res.headers.get('content-type') || '').toLowerCase();

  // 服务端不支持流式 → 走普通 JSON
  if (!res.body || !ctype.includes('event-stream')) {
    const data = await res.json();
    const txt = (data && data.choices && data.choices[0] && data.choices[0].message &&
                 data.choices[0].message.content) || '';
    if (txt) onDelta(txt);
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const chunks = buffer.split('\n');
    buffer = chunks.pop() || '';

    for (const rawLine of chunks) {
      const line = rawLine.trim();
      if (!line || line.startsWith(':')) continue;
      if (!line.startsWith('data:')) continue;

      const payload = line.slice(5).trim();
      if (payload === '[DONE]') continue;

      try {
        const json = JSON.parse(payload);
        const choice = json.choices && json.choices[0];
        const delta = choice && choice.delta;
        const piece = delta && delta.content;
        if (piece) onDelta(piece);
      } catch (e) { /* 忽略不完整的数据块 */ }
    }
  }
}

/* ---------- 组装 API 消息 ---------- */
function toApiMessages() {
  const out = [{ role: 'system', content: SYSTEM_PROMPT }];

  for (const m of state.messages) {
    if (m.role === 'assistant') {
      if (!m.text || !m.text.trim()) continue;   // 跳过正在生成的占位消息
      out.push({ role: 'assistant', content: m.text });
    } else {
      if (m.image) {
        out.push({
          role: 'user',
          content: [
            { type: 'text', text: (m.text && m.text.trim()) ? m.text : '请提取这张图片中的文字，并输出文本。' },
            { type: 'image_url', image_url: { url: m.image } }
          ]
        });
      } else if (m.text && m.text.trim()) {
        out.push({ role: 'user', content: m.text });
      }
    }
  }
  return out;
}

 * 发送消息
 * ================================================================ */
async function sendMessage() {
  if (state.sending) return;

  const text = inputEl.value.trim();
  const image = state.pendingImage;
  if (!text && !image) return;

  /* ★ 发出消息后，聊天框自动清空 */
  inputEl.value = '';
  resizeInput();
  clearPendingImage();

  /* 用户消息 */
  const userMsg = { id: uid(), role: 'user', text: text, image: image || null };
  state.messages.push(userMsg);
  messagesEl.appendChild(createMessageEl(userMsg));
  scrollToBottom(true);

  /* AI 占位消息 */
  const aiMsg = { id: uid(), role: 'assistant', text: '' };
  state.messages.push(aiMsg);
  const aiEl = createMessageEl(aiMsg);
  aiEl._body.innerHTML = '<span class="caret"></span>';
  messagesEl.appendChild(aiEl);
  scrollToBottom(true);

  state.sending = true;
  btnSend.disabled = true;
  tbStatus.textContent = '正在思考…';

  const model = image ? CONFIG.MODEL_VISION : CONFIG.MODEL_TEXT;
  setModelTag(model, !!image);

  try {
    let acc = '';
    await callDeepSeek(toApiMessages(), model, (delta) => {
      acc += delta;
      aiMsg.text = acc;
      aiEl._body.innerHTML = renderMarkdown(acc) + '<span class="caret"></span>';
      scrollToBottom();
    });

    if (!aiMsg.text || !aiMsg.text.trim()) {
      aiMsg.text = '（接口没有返回任何内容，请检查模型名称或网络）';
    }
    aiEl._body.innerHTML = renderMarkdown(aiMsg.text);

  } catch (err) {
    aiEl.classList.add('error');
    aiMsg.text = '⚠️ 请求失败：\n\n```\n' + (err && err.message ? err.message : String(err)) + '\n```';
    aiEl._body.innerHTML = renderMarkdown(aiMsg.text);
  } finally {
    state.sending = false;
    btnSend.disabled = false;
    tbStatus.textContent = '在线 · DeepSeek 推理引擎';
    saveHistory();
    scrollToBottom(true);
  }
}

function setModelTag(model, isVision) {
  modelTag.textContent = model;
  modelTag.classList.toggle('vision', !!isVision);
}

/* ================================================================
 * 输入框
 * ================================================================ */
function resizeInput() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}

inputEl.addEventListener('input', resizeInput);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});

btnSend.addEventListener('click', sendMessage);

window.addEventListener('resize', resizeInput);

/* ================================================================
 * 图片上传（提取图片文字 / 识别图片信息）
 * ================================================================ */
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('请选择图片文件');
    return;
  }

  try {
    state.pendingImage = await compressImage(file, 1600, 0.86);
    renderPreview();
  } catch (err) {
    alert('图片读取失败：' + err.message);
  }
});

function renderPreview() {
  previewEl.innerHTML = '';
  if (!state.pendingImage) {
    previewEl.classList.remove('show');
    return;
  }
  previewEl.classList.add('show');

  const box = document.createElement('div');
  box.className = 'thumb';

  const img = document.createElement('img');
  img.src = state.pendingImage;
  img.alt = '预览';

  const del = document.createElement('button');
  del.className = 'del';
  del.type = 'button';
  del.textContent = '×';
  del.title = '移除图片';
  del.onclick = () => clearPendingImage();

  box.appendChild(img);
  box.appendChild(del);
  previewEl.appendChild(box);
}

function clearPendingImage() {
  state.pendingImage = null;
  renderPreview();
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

async function compressImage(file, maxSide, quality) {
  const dataUrl = await fileToDataURL(file);
  if (!/^data:image\/(jpeg|png|webp)/i.test(dataUrl)) return dataUrl;

  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));

      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);

      try { resolve(cv.toDataURL('image/jpeg', quality)); }
      catch (e) { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* ================================================================
 * 图片放大
 * ================================================================ */
function openLightbox(src) {
  $('lightboxImg').src = src;
  $('lightbox').classList.add('show');
}
$('lightbox').addEventListener('click', () => {
  $('lightbox').classList.remove('show');
  $('lightboxImg').src = '';
});

/* ================================================================
 * 音乐播放器
 * ================================================================ */
const TRACKS = (CONFIG.PLAYLIST || []).map((name) => ({
  name,
  src: encodeURI(CONFIG.MUSIC_DIR.replace(/\/?$/, '/') + name + '.mp3')
}));

let curIdx = -1;

function loadTrack(index, autoplay) {
  if (!TRACKS.length) return;

  curIdx = ((index % TRACKS.length) + TRACKS.length) % TRACKS.length;
  const track = TRACKS[curIdx];

  songName.classList.remove('err');
  songName.textContent = track.name;
  audio.src = track.src;
  renderPlaylist();

  if (autoplay) {
    audio.play().catch(() => {
      songName.classList.add('err');
      songName.textContent = track.name + '（音频文件未找到）';
    });
  }
}

function renderPlaylist() {
  playlistEl.innerHTML = '';
  TRACKS.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'pl-item' + (i === curIdx ? ' active' : '');
    item.innerHTML =
      '<span class="pl-idx">' + (i + 1) + '</span>' +
      '<span class="pl-name">' + escapeHtml(t.name) + '</span>' +
      '<span class="pl-play">♪</span>';
    item.onclick = () => {
      loadTrack(i, true);
      playlistEl.classList.remove('show');
    };
    playlistEl.appendChild(item);
  });
}

btnPlay.addEventListener('click', () => {
  if (curIdx === -1) { loadTrack(0, true); return; }
  if (audio.paused) {
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
});

btnPrev.addEventListener('click', () => {
  if (curIdx === -1) { loadTrack(0, true); return; }
  loadTrack(curIdx - 1, true);
});

btnNext.addEventListener('click', () => {
  if (curIdx === -1) { loadTrack(0, true); return; }
  loadTrack(curIdx + 1, true);
});

btnList.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!playlistEl.children.length) renderPlaylist();
  playlistEl.classList.toggle('show');
});

document.addEventListener('click', (e) => {
  if (playlistEl.classList.contains('show') &&
      !playlistEl.contains(e.target) && e.target !== btnList) {
    playlistEl.classList.remove('show');
  }
});

audio.addEventListener('play',  () => { btnPlay.textContent = '⏸'; });
audio.addEventListener('pause', () => { btnPlay.textContent = '▶'; });

audio.addEventListener('timeupdate', () => {
  const dur = audio.duration || 0;
  const cur = audio.currentTime || 0;
  pBar.style.width = dur ? ((cur / dur) * 100).toFixed(2) + '%' : '0%';
  pTime.textContent = formatTime(cur) + ' / ' + formatTime(dur);
});

audio.addEventListener('ended', () => {
  if (curIdx === -1) return;
  loadTrack(curIdx + 1, true);
});

audio.addEventListener('error', () => {
  if (curIdx >= 0) {
    songName.classList.add('err');
    songName.textContent = TRACKS[curIdx].name + '（音频文件未找到）';
  }
});

pTrack.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = pTrack.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  audio.currentTime = audio.duration * ratio;
});

/* ================================================================
 * 登录逻辑
 * ================================================================ */
function showLoginMsg(text, ok) {
  loginMsgEl.textContent = text || '';
  loginMsgEl.classList.toggle('ok', !!ok);
}

$('togglePwd').addEventListener('click', () => {
  const isPwd = loginKeyEl.type === 'password';
  loginKeyEl.type = isPwd ? 'text' : 'password';
  $('togglePwd').textContent = isPwd ? '🙈' : '👁';
});

loginForm.addEventListener('submit', (e) => {
  e.preventDefault();

  const user = loginUserEl.value.trim();
  const key = loginKeyEl.value.trim();

  if (!user || !key) {
    showLoginMsg('请输入用户名和白名单秘钥');
    return;
  }

  const ok = (CONFIG.USERS || []).some(
    (u) => u.username === user && u.key === key
  );

  if (!ok) {
    showLoginMsg('用户名或白名单秘钥不正确');
    const card = document.querySelector('.login-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    return;
  }

  state.user = user;

  if (rememberChk.checked) {
    try { localStorage.setItem(LS_AUTH, JSON.stringify({ u: user, k: key })); } catch (err) {}
  } else {
    try { localStorage.removeItem(LS_AUTH); } catch (err) {}
  }

  showLoginMsg('验证通过，正在进入…', true);
  setTimeout(enterChat, 180);
});

function tryAutoLogin() {
  try {
    const raw = localStorage.getItem(LS_AUTH);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data && (CONFIG.USERS || []).some((u) => u.username === data.u && u.key === data.k)) {
      state.user = data.u;
      return true;
    }
  } catch (e) {}
  return false;
}

function enterChat() {
  loginScreen.classList.add('hidden');
  chatScreen.classList.remove('hidden');

  loadHistory();
  messagesEl.innerHTML = '';
  state.messages.forEach((m) => messagesEl.appendChild(createMessageEl(m)));

  if (!state.messages.length) pushWelcome();

  scrollToBottom(true);
  resizeInput();
  setTimeout(() => inputEl.focus(), 120);
}

function pushWelcome() {
  const welcome = {
    id: uid(),
    role: 'assistant',
    text: '你好，我是 **XiaozLucifer-v10**，一个本地部署、云端接入 DeepSeek 推理服务的智能引擎。\n\n- 直接输入问题即可开始对话\n- 点击输入框左侧 🖼 上传图片，可提取图片文字 / 识别图片信息\n- 我的每条回复下方都有「编辑」按钮，回复完成后可自定义修改文字内容\n- 右下角 ☰ 可打开歌曲播放列表'
  };
  state.messages.push(welcome);
  messagesEl.appendChild(createMessageEl(welcome));
  saveHistory();
}

/* ================================================================
 * 顶栏按钮
 * ================================================================ */
$('btnClear').addEventListener('click', () => {
  if (!confirm('确定要清空当前对话记录吗？')) return;
  state.messages = [];
  messagesEl.innerHTML = '';
  try { localStorage.removeItem(LS_HISTORY); } catch (e) {}
  pushWelcome();
});

$('btnLogout').addEventListener('click', () => {
  try { localStorage.removeItem(LS_AUTH); } catch (e) {}
  location.reload();
});

/* ================================================================
 * 初始化
 * ================================================================ */
function init() {
  /* 背景图片（★ 在 CONFIG.BG_IMAGE 里替换） */
  if (CONFIG.BG_IMAGE) {
    document.documentElement.style.setProperty('--bg-image', 'url("' + CONFIG.BG_IMAGE + '")');
  }

  /* AI 头像（★ 在 CONFIG.AI_AVATAR 里替换） */
  if (CONFIG.AI_AVATAR) {
    const la = $('loginAvatar');
    const ca = $('chatAvatar');
    if (la) la.src = CONFIG.AI_AVATAR;
    if (ca) ca.src = CONFIG.AI_AVATAR;
  }

  /* 播放器初始化 */
  renderPlaylist();
  setModelTag(CONFIG.MODEL_TEXT, false);

  /* 自动登录 */
  if (tryAutoLogin()) {
    enterChat();
  } else {
    loginScreen.classList.remove('hidden');
    chatScreen.classList.add('hidden');
    setTimeout(() => loginUserEl.focus(), 200);
  }
}

init();
</script>
